version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:0.8.0-pg17

    container_name: darkatlas_postgres

    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend


volumes:
  postgres_data:

networks:
  backend: